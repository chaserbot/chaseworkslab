global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: chaseworkslab
    site: homelab

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:

  # ── Prometheus self-scrape ────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Proxmox bare-metal nodes (node_exporter) ─────────────────────────────
  - job_name: node_proxmox
    static_configs:
      - targets:
          - '10.27.27.101:9100'
        labels:
          role: proxmox
          node: pve1
          host: mm2
      - targets:
          - '10.27.27.102:9100'
        labels:
          role: proxmox
          node: pve2
          host: mm3
      - targets:
          - '10.27.27.103:9100'
        labels:
          role: proxmox
          node: pve3
          host: mm4

  # ── MM1 — NAS brain / DAS host (macOS node_exporter) ────────────────────
  - job_name: node_mm1
    static_configs:
      - targets:
          - '10.27.27.22:9100'
        labels:
          role: nas
          host: mm1

  # ── CK10 — Jellyfin Windows host (windows_exporter) ─────────────────────
  - job_name: windows_ck10
    static_configs:
      - targets:
          - '10.27.27.33:9182'
        labels:
          role: media
          os: windows
          host: ck10

  # ── docker-arr VM — node_exporter ────────────────────────────────────────
  - job_name: node_docker_arr
    static_configs:
      - targets:
          - '10.27.27.47:9100'
        labels:
          role: arr
          host: docker-arr

  # ── Proxmox API metrics (pve_exporter) ───────────────────────────────────
  # pve_exporter runs in its own LXC at 10.27.27.139 (pve3).
  # Multi-target: Prometheus passes each PVE node IP as ?target=<ip>.
  # See: monitoring/prometheus/pve-exporter-setup.md
  - job_name: pve_api
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets:
          - '10.27.27.101'
        labels:
          node: pve1
          host: mm2
      - targets:
          - '10.27.27.102'
        labels:
          node: pve2
          host: mm3
      - targets:
          - '10.27.27.103'
        labels:
          node: pve3
          host: mm4
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '10.27.27.139:9221'  # pve_exporter LXC

  # ── Arr stack metrics (Scraparr LXC) ─────────────────────────────────────
  # Single exporter covers Sonarr, Radarr, Prowlarr.
  # Expect a DOWN target until API keys are configured.
  # Config lives at /scraparr/config/config.yaml in the Scraparr LXC.
  # See: monitoring/scraparr/config.yaml
  - job_name: scraparr
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.27.27.138:7100'
        labels:
          role: arr

  # ── qBittorrent exporter (LXC) ───────────────────────────────────────────
  # Connects to qBittorrent web UI at 10.27.27.47:8080 (via Gluetun).
  # Expect a DOWN target until qBittorrent credentials are configured.
  - job_name: qbittorrent
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.27.27.137:8090'
        labels:
          role: arr
          app: qbittorrent

  # ── cAdvisor — Docker container metrics (docker-arr VM) ──────────────────
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.27.27.47:8085'
        labels:
          role: arr
          app: cadvisor
