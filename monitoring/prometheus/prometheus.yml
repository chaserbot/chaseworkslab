global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    cluster: chaseworkslab
    site: homelab

# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['localhost:9093']

# rule_files:
#   - /etc/prometheus/rules/*.yml

scrape_configs:

  # ── Prometheus self-scrape ────────────────────────────────────────────────
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # ── Proxmox bare-metal nodes (node_exporter) ─────────────────────────────
  - job_name: node_proxmox
    static_configs:
      - targets:
          - '10.27.27.101:9100'
        labels:
          role: proxmox
          node: pve1
          host: mm2
      - targets:
          - '10.27.27.102:9100'
        labels:
          role: proxmox
          node: pve2
          host: mm3
      - targets:
          - '10.27.27.103:9100'
        labels:
          role: proxmox
          node: pve3
          host: mm4

  # ── MM1 — NAS brain / DAS host (macOS node_exporter) ────────────────────
  - job_name: node_mm1
    static_configs:
      - targets:
          - '10.27.27.22:9100'
        labels:
          role: nas
          host: mm1

  # ── CK10 — Jellyfin Windows host (windows_exporter) ─────────────────────
  - job_name: windows_ck10
    static_configs:
      - targets:
          - '10.27.27.33:9182'
        labels:
          role: media
          os: windows
          host: ck10

  # ── docker-arr VM — node_exporter ────────────────────────────────────────
  - job_name: node_docker_arr
    static_configs:
      - targets:
          - '10.27.27.47:9100'
        labels:
          role: arr
          host: docker-arr

  # ── Proxmox API metrics (pve_exporter) ───────────────────────────────────
  # pve_exporter runs in its own LXC at 10.27.27.139 (pve3).
  # Multi-target: Prometheus passes each PVE node IP as ?target=<ip>.
  # See: monitoring/prometheus/pve-exporter-setup.md
  - job_name: pve_api
    metrics_path: /pve
    params:
      module: [default]
    static_configs:
      - targets:
          - '10.27.27.101'
        labels:
          node: pve1
          host: mm2
      - targets:
          - '10.27.27.102'
        labels:
          node: pve2
          host: mm3
      - targets:
          - '10.27.27.103'
        labels:
          node: pve3
          host: mm4
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '10.27.27.139:9221'  # pve_exporter LXC

  # ── Arr stack metrics (Exportarr sidecars on docker-arr VM) ──────────────
  # One Exportarr instance per Arr app; API keys live in arr/.env on docker-arr.
  - job_name: exportarr
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.27.27.47:9707'
        labels:
          role: arr
          app: radarr
      - targets:
          - '10.27.27.47:9708'
        labels:
          role: arr
          app: sonarr
      - targets:
          - '10.27.27.47:9709'
        labels:
          role: arr
          app: prowlarr

  # ── qBittorrent exporter (LXC) ───────────────────────────────────────────
  # Connects to qBittorrent web UI at 10.27.27.47:8080 (via Gluetun).
  # Expect a DOWN target until qBittorrent credentials are configured.
  - job_name: qbittorrent
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.27.27.137:8090'
        labels:
          role: arr
          app: qbittorrent

  # ── cAdvisor — Docker container metrics (docker-arr VM) ──────────────────
  - job_name: cadvisor
    metrics_path: /metrics
    static_configs:
      - targets:
          - '10.27.27.47:8085'
        labels:
          role: arr
          app: cadvisor

  # ── Blackbox — HTTP service probes ───────────────────────────────────────
  # blackbox_exporter runs in its own pve3 LXC at 10.27.27.136:9115.
  # See: monitoring/blackbox/blackbox.yml
  - job_name: blackbox_http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://10.27.27.110/
          - http://10.27.27.111:81/
          - http://10.27.27.33:8096/
          - http://10.27.27.47:5055/
          - http://10.27.27.47:7878/
          - http://10.27.27.47:8989/
          - http://10.27.27.47:9696/
          - http://10.27.27.130:9090/
          - https://10.27.27.101:8006/
          - https://10.27.27.102:8006/
          - https://10.27.27.103:8006/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '10.27.27.136:9115'

  # ── Blackbox — TCP probes for non-HTTP essentials ────────────────────────
  - job_name: blackbox_tcp
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - 10.27.27.110:53
          - 10.27.27.111:80
          - 10.27.27.111:443
          - 10.27.27.47:8080
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: '10.27.27.136:9115'
