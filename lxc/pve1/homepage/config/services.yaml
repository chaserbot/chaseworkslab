        proxmoxVMID: 210
        widget:
          type: overseerr
          url: http://10.27.27.47:5055
          key: "{{HOMEPAGE_VAR_OVERSEERR_API_KEY}}"
    - Sonarr:
        href: http://10.27.27.47:8989
        description: TV show automation
        icon: sonarr.png
        ping: http://10.27.27.47:8989
        proxmoxNode: pve2
        proxmoxVMID: 210
        widget:
          type: sonarr
          url: http://10.27.27.47:8989
          key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
    - Radarr:
        href: http://10.27.27.47:7878
        description: Movie automation
        icon: radarr.png
        ping: http://10.27.27.47:7878
        proxmoxNode: pve2
        proxmoxVMID: 210
        widget:
          type: radarr
          url: http://10.27.27.47:7878
          key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
    - Prowlarr:
        href: http://10.27.27.47:9696
        description: Indexer management
        icon: prowlarr.png
        ping: http://10.27.27.47:9696
        proxmoxNode: pve2
        proxmoxVMID: 210
        widget:
          type: prowlarr
          url: http://10.27.27.47:9696
          key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
    - qBittorrent:
        href: http://10.27.27.47:8080
        description: Torrent client
        icon: qbittorrent.png
        ping: http://10.27.27.47:8080
        proxmoxNode: pve2
        proxmoxVMID: 210
        widget:
          type: qbittorrent
          url: http://10.27.27.47:8080
          username: admin
          password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
          enableLeechProgress: true
          enableLeechSize: true

