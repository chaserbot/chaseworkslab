---
# Homepage services.yaml
# Copy to /opt/homepage/config/services.yaml on the Homepage LXC (CT102, 10.27.27.112)
#
# IPs pulled from inventory/README.md — update this file if services move to their
# planned Proxmox LXC IPs (see the "Planned" section in inventory/README.md).
#
# ⚠️ Paperless-ngx port (8000) needs confirmation on MM1.
#
# Secrets are injected via {{HOMEPAGE_VAR_*}} from /opt/homepage/config/.env
# See .env.example in this directory for required variables.
#
# ping uses full URLs so Homepage checks the port, not just host reachability.
# Proxmox uses https — self-signed cert may cause a ping warning; that's expected.
# Proxmox widget: username format is "user@realm" (e.g. root@pam).
# Uptime Kuma widget: slug is the status page slug from Settings > Status Pages.

- Infrastructure:
    - pve1:
        href: https://10.27.27.101:8006
        description: Proxmox Node 1 — MM2
        icon: proxmox.png
        ping: https://10.27.27.101:8006
        widget:
          type: proxmox
          url: https://10.27.27.101:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve1
          allowInsecure: true
    - pve2:
        href: https://10.27.27.102:8006
        description: Proxmox Node 2 — MM3
        icon: proxmox.png
        ping: https://10.27.27.102:8006
        widget:
          type: proxmox
          url: https://10.27.27.102:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve2
          allowInsecure: true
    - pve3:
        href: https://10.27.27.103:8006
        description: Proxmox Node 3 — MM4
        icon: proxmox.png
        ping: https://10.27.27.103:8006
        widget:
          type: proxmox
          url: https://10.27.27.103:8006
          username: "{{HOMEPAGE_VAR_PROXMOX_TOKEN}}"
          password: "{{HOMEPAGE_VAR_PROXMOX_TOKEN_SECRET}}"
          node: pve3
          allowInsecure: true
    - UniFi:
        href: https://10.27.27.1
        description: UniFi network controller — UX7
        icon: unifi.png
        ping: https://10.27.27.1
        # widget disabled — UX7 routes auth through Ubiquiti cloud SSO (MFA required),
        # local-only admin accounts not available on this firmware
        # widget:
        #   type: unifi
        #   url: https://10.27.27.1
        #   username: "{{HOMEPAGE_VAR_UNIFI_USERNAME}}"
        #   password: "{{HOMEPAGE_VAR_UNIFI_PASSWORD}}"
        #   site: default
        #   allowInsecure: true
    - AdGuard Home:
        href: http://10.27.27.110
        description: DNS and ad blocking — pve1 CT110
        icon: adguard-home.png
        ping: http://10.27.27.110
        proxmoxNode: pve1
        proxmoxVMID: 110
        proxmoxType: lxc
        widget:
          type: adguard
          url: http://10.27.27.110
          username: admin
          password: "{{HOMEPAGE_VAR_ADGUARD_PASSWORD}}"
    - Nginx Proxy Manager:
        href: http://10.27.27.111:81
        description: Reverse proxy admin — pve1 CT101
        icon: nginx-proxy-manager.png
        ping: http://10.27.27.111:81
        proxmoxNode: pve1
        proxmoxVMID: 101
        proxmoxType: lxc
        widget:
          type: npm
          url: http://10.27.27.111:81
          username: chasecook00@gmail.com
          password: "{{HOMEPAGE_VAR_NPM_PASSWORD}}"

- Media:
    - Jellyfin:
        href: http://10.27.27.33:8096
        description: Media server — CK10
        icon: jellyfin.png
        ping: http://10.27.27.33:8096
        widget:
          type: jellyfin
          url: http://10.27.27.33:8096
          key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
    - Audiobookshelf:
        href: http://10.27.27.22:13378
        description: Audiobooks and podcasts — MM1
        icon: audiobookshelf.png
        ping: http://10.27.27.22:13378
        widget:
          type: audiobookshelf
          url: http://10.27.27.22:13378
          key: "{{HOMEPAGE_VAR_AUDIOBOOKSHELF_API_KEY}}"

- Arr Stack:
    - Seerr:
